name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check backend
        run: python -m py_compile app.py db.py metrics.py build_db.py templates.py
      - name: Verify daily verses resolve
        run: python scripts/verify_daily_verses.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graceguide-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
